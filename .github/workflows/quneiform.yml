name: quneiform

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: quneiform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'true'

      - name: install quneiform
        run: |
             git clone https://github.com/eclipse-quneiform/quneiform.git --recurse-submodules
             cd quneiform
             cmake ./
             make -j4
             cd ..

      - name: analyze
        run: |
             ./quneiform/bin/quneiform ./src -q \
             --ignore=app/sbom.h,Wisteria-Dataviz/demo/demo.cpp,Wisteria-Dataviz/src/base/version.h,Wisteria-Dataviz/src/math,Wisteria-Dataviz/src/debug,Wisteria-Dataviz/src/util/logfile.cpp,Wisteria-Dataviz/src/base/svgreportprintout.cpp,Wisteria-Dataviz/src/import/,Wisteria-Dataviz/tests,lua,Wisteria-Dataviz/src/base/colors.cpp,Wisteria-Dataviz/locale/es.po,readability,Catch2,OleanderStemmingLibrary,tinyexpr-plusplus,tinyxml2,Wisteria-Dataviz/src/utfcpp,Wisteria-Dataviz/src/easyexif,Wisteria-Dataviz/src/CRCpp,Wisteria-Dataviz/src/wxSimpleJSON \
             --enable=allI18N,allCodeFormatting --disable=suspectL10NUsage,unencodedExtASCII \
             --cpp-version=2017 \
             --untranslatables="Fry,Degrees of Reading Power,Bormuth Grade Placement,Bormuth Cloze Mean,Automated Readability Index,Gunning Fog,SMOG,PSK Gunning Fog,Rate Index,New Dale-Chall,Flesch,New Fog Count,Modified SMOG,New Automated Readability Index,Flesch Reading Ease,Jakarta,Eclipse Foundation,Eclipse" \
             -o i18nresultsSrcFolder.txt

             ./quneiform/bin/quneiform ./docs -q --enable=allI18N --ignore=readability-studio-manual/acknowledgements/libraries.qmd -o i18nresultsDocsFolder.txt

             cat i18nresultsSrcFolder.txt i18nresultsDocsFolder.txt > i18nresults.txt
             
      - name: print output
        run: |
             REPORTFILE=./i18nresults.txt
             WARNINGSFILE=./warnings.txt
             if test -f "$REPORTFILE"; then
                cat "$REPORTFILE" > "$WARNINGSFILE"
                # are there any warnings?
                if grep -qP '\[[a-zA-Z0-9]+\]' "$WARNINGSFILE"; then
                    # print the remaining warnings
                    echo Warnings detected:
                    echo ==================
                    cat "$WARNINGSFILE" | grep -P '\[[a-zA-Z0-9]+\]'
                    # fail the job
                    exit 1
                else
                    echo No warnings detected
                fi
             else
                echo "$REPORTFILE" not found
             fi
