name: Linux Build

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ubuntu-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download wxWidgets
        run: |
             export DISPLAY=:0.0
             export DEBIAN_FRONTEND=noninteractive
             sudo apt-get update && sudo apt-get install xvfb cmake libtbb-dev libgtk-3-0 libgtk-3-dev libwebkit2gtk-4.1-0 libwebkit2gtk-4.1-dev libcurl4-openssl-dev
             git clone https://github.com/wxWidgets/wxWidgets.git --recurse-submodules

      - name: Install linuxdeploy
        run: |
             mkdir -p "$HOME/tools"
             curl -fsSL -o "$HOME/tools/linuxdeploy" \
               https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
             curl -fsSL -o "$HOME/tools/linuxdeploy-plugin-appimage" \
               https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
             chmod +x "$HOME/tools/linuxdeploy" "$HOME/tools/linuxdeploy-plugin-appimage"
             echo "$HOME/tools" >> "$GITHUB_PATH"

      - name: Import GPG key
        # only touch the signing key on trusted pushes to main, never on PRs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
             mkdir -p ~/.gnupg
             chmod 700 ~/.gnupg
             # the appimage plugin signs via gpgme (not the gpg CLI), so CLI flags like
             # --pinentry-mode loopback are ignored. instead let the agent cache the
             # passphrase so gpgme can sign without a tty.
             {
               echo "allow-loopback-pinentry"
               echo "allow-preset-passphrase"
               echo "default-cache-ttl 7200"
               echo "max-cache-ttl 7200"
             } > ~/.gnupg/gpg-agent.conf
             # restart/reload the agent so the new options (allow-preset-passphrase) take
             # effect. avoid `gpg-agent --daemon`: it warns and exits non-zero (aborting
             # under `set -e`) when the runner already has an agent running. gpgconf is
             # idempotent, and --reload re-reads the conf even if the agent survived the kill.
             gpgconf --kill gpg-agent
             gpgconf --launch gpg-agent
             gpgconf --reload gpg-agent
             echo "$GPG_PRIVATE_KEY" | gpg --batch --import
             # preset the passphrase into the agent for every secret keygrip
             GPG_PRESET="$(gpgconf --list-dirs libexecdir)/gpg-preset-passphrase"
             for KEYGRIP in $(gpg --batch --with-colons --with-keygrip --list-secret-keys | awk -F: '/^grp:/ {print $10}'); do
               printf '%s' "$GPG_PASSPHRASE" | "$GPG_PRESET" --preset "$KEYGRIP"
             done

      - name: Build
        env:
          # sign only on trusted pushes to main; PRs build but leave the AppImage unsigned
          SIGN: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && '1' || '' }}
          SIGN_KEY: ${{ secrets.GPG_KEY_ID }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
             cmake . -DCMAKE_BUILD_TYPE=Release
             cmake --build . --target=readstudio -j4 --config Release
             linuxdeploy \
               --appdir installers/unix/AppDir \
               --executable installers/unix/AppDir/usr/bin/readstudio \
               -d installers/unix/AppDir/org.eclipse.readabilitystudio.desktop \
               -i installers/unix/AppDir/app-logo.svg \
               --output appimage
             mv Readability_Studio*.AppImage ./installers/unix

      - name: Verify AppImage signature
        # only meaningful when the AppImage was actually signed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
             APPIMAGE=$(ls ./installers/unix/Readability_Studio*.AppImage | head -n1)
             chmod +x "$APPIMAGE"
             SIG=$("$APPIMAGE" --appimage-signature)
             if [ -z "$SIG" ]; then
               echo "ERROR: AppImage is not signed"
               exit 1
             fi
             echo "Embedded signature:"
             echo "$SIG"
             # --appimage-signing-key isn't implemented in every type2-runtime build,
             # so treat it as informational and don't fail the step if it's unsupported
             echo "Signing key fingerprint:"
             "$APPIMAGE" --appimage-signing-key || echo "(signing-key lookup not supported by this runtime)"

      - name: Archive AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Linux AppImage
          path: ${{ github.workspace }}/installers/unix/*.AppImage
