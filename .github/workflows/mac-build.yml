name: macOS Build

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macos-build
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download wxWidgets
        run: |
             brew install cmake
             brew install create-dmg
             git clone https://github.com/wxWidgets/wxWidgets.git --recurse-submodules

      - name: Build
        run: |
             cmake -S . -B ./build -DCMAKE_BUILD_TYPE=Release
             cmake --build ./build --target all -j4 --config Release

      # tar the bundle first: upload-artifact does not preserve permissions and
      # dereferences symlinks, which would corrupt the .app and break code signing
      - name: Package App Bundle
        run: |
             cd "${{ github.workspace }}/installers/macos/release"
             tar czf "${{ github.workspace }}/readstudio-macos.tar.gz" *.app

      - name: Archive App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: macOS App Bundle
          path: ${{ github.workspace }}/readstudio-macos.tar.gz
